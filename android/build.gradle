group 'com.jhomlala.better_player.better_player'
version '1.0-SNAPSHOT'

buildscript {
    ext {
        exoPlayerVersion = "1.6.0"
        lifecycleVersion = "2.7.0"
        annotationVersion = "1.7.1"
        workVersion = "2.9.0"
        coreVersion = "1.12.0"
        gradleVersion = "8.2.1"
        kotlinVersion = "2.0.20"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.jhomlala.better_player'
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        implementation "androidx.media3:media3-exoplayer:$exoPlayerVersion"
        implementation "androidx.media3:media3-exoplayer-hls:$exoPlayerVersion"
        implementation "androidx.media3:media3-exoplayer-dash:$exoPlayerVersion"
        implementation "androidx.media3:media3-exoplayer-smoothstreaming:$exoPlayerVersion"
        implementation "androidx.media3:media3-ui:$exoPlayerVersion"
        implementation "androidx.media3:media3-session:$exoPlayerVersion"
        implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
        implementation "androidx.lifecycle:lifecycle-common:$lifecycleVersion"
        implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycleVersion"
        implementation "androidx.annotation:annotation:$annotationVersion"
        implementation "androidx.work:work-runtime:$workVersion"
        implementation 'com.blankj:utilcodex:1.31.1'
        implementation 'com.google.android.material:material:1.11.0'
        implementation 'com.google.code.gson:gson:2.10.1'
        implementation "androidx.work:work-runtime-ktx:2.9.0"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
}
